name: Docker CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Копируем код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем netcat для проверки портов
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd

      # 3. Авторизация на Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Сборка образов и запуск контейнеров
      - name: Build and Start Containers
        run: |
          # Создаем сеть для взаимодействия контейнеров
          docker network create lab_network

          # Сборка образов с использованием секретов для тегов
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mysql-db ./mysql_db
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/database-service ./database_service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/auth-container ./auth_service

          # Запуск MySQL
          docker run -d --name mysql_db --network lab_network ${{ secrets.DOCKERHUB_USERNAME }}/mysql-db
          
          # Запуск сервиса БД
          docker run -d --name database_service --network lab_network ${{ secrets.DOCKERHUB_USERNAME }}/database-service
          
          # Запуск основного приложения (Auth App)
          docker run -d --name auth-container --network lab_network -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/auth-container

    Ты практически у цели! В твоем YAML-файле всё выглядит логично, но есть одна техническая деталь в Шаге 5, которая вызывает ту самую ошибку 56.
    
    Когда curl сталкивается с тем, что контейнер еще не готов (соединение сбрасывается), он завершает работу с ошибкой, и весь пайплайн останавливается, не успев сделать следующую попытку в цикле.

    Вот финальный вариант Шага 5, который проигнорирует сетевые ошибки и дождется запуска:

    Исправленный блок ожидания (Шаг 5)
    YAML
    # 5. Ждем, пока сайт и БД будут полностью готовы
    - name: Wait for Services
    run: |
      echo "Ожидание полной готовности (PHP + MySQL)..."
      # Даем небольшую паузу сразу после старта
      sleep 10
      
      for i in {1..20}; do
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/index.php || echo "000")
      
        if [ "$STATUS" -eq 200 ]; then
          echo "✅ Все сервисы готовы (HTTP 200)!"
          break
        fi
      
        echo "Попытка $i: Статус сервера [$STATUS]. Ждем..."
        sleep 5
      
        if [ $i -eq 20 ]; then
          echo "❌ Сервисы не поднялись за отведенное время."
          docker logs auth-container
          exit 1
        fi
      done

      # 6. Функциональный тест (проверка на короткий пароль)
      - name: Functional Test
        run: |
          # Отправляем запрос и выводим ответ в лог
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"password": "123"}' \
            http://localhost:80/index.php)
          
          echo "Ответ сервера: $RESPONSE"

          # Проверяем наличие слова "короткий" в любом виде
          if echo "$RESPONSE" | grep -q "короткий" || echo "$RESPONSE" | grep -q "043a"; then
              echo "✅ Тест пройден: валидация сработала."
          else
              echo "❌ Тест провален: текст ошибки не найден."
              exit 1
          fi

      # 7. Отправка готовых образов в Docker Hub
      - name: Push Images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mysql-db
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/database-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/auth-container

      # 8. Очистка ресурсов
      - name: Shutdown and Cleanup
        if: always()
        run: |
          docker stop auth-container database_service mysql_db || true
          docker rm auth-container database_service mysql_db || true
          docker network rm lab_network || true