name: Docker CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Копируем код из репозитория в виртуальную машину GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем netcat (нужен для проверки доступности портов)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd

      # 3. Авторизация на Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Сборка образов и запуск контейнеров вручную (без compose)
      - name: Build and Start Containers
        run: |
          # Создаем виртуальную сеть Docker
          docker network create lab_network

          # Собираем образы (тегируем их вашим логином Docker Hub)
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mysql-db ./mysql_db
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/database-service ./database_service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/auth-app ./auth_service

          # Запускаем контейнеры по очереди
          # Контейнер с БД
          docker run -d --name mysql_db --network lab_network ${{ secrets.DOCKERHUB_USERNAME }}/mysql-db
          
          # Контейнер сервиса базы данных
          docker run -d --name database_service --network lab_network ${{ secrets.DOCKERHUB_USERNAME }}/database-service
          
          # Контейнер основного приложения (открываем порт 80 для тестов)
          docker run -d --name auth_app --network lab_network -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/auth-app

      # 5. Проверка: поднялись ли сервисы
      - name: Test Endpoints with Curl
        run: |
          echo "Ожидание запуска (15 секунд)..."
          sleep 15
          
          echo "Проверка доступности сайта (порт 80)..."
          curl -f http://localhost:80/index.php || exit 1
          
          echo "Проверка доступности порта 8080 (nc)..."
          nc -zv localhost 8080 || echo "Порт 8080 не отвечает, но продолжаем..."

      # 6. Функциональный тест валидации
      - name: Functional Test
        run: |
          RESPONSE=$(curl -s -X POST -d "password=123" http://localhost:80/index.php)
          if echo "$RESPONSE" | grep -q "Слишком короткий"; then
             echo "Тест пройден: валидация работает."
          else
             echo "Тест провален: ожидалась ошибка валидации."
             exit 1
          fi

      # 7. Отправка готовых образов в ваш Docker Hub
      - name: Push Images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mysql-db
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/database-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/auth-app

      # 8. Очистка после работы
      - name: Shutdown and Cleanup
        if: always()
        run: |
          docker stop auth_app database_service mysql_db || true
          docker rm auth_app database_service mysql_db || true
          docker network rm lab_network || true