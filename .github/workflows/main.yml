name: Docker CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Копируем код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем netcat для проверки портов
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd

      # 3. Авторизация на Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Сборка образов и запуск контейнеров
      - name: Build and Start Containers
        run: |
          # Создаем сеть для взаимодействия контейнеров
          docker network create lab_network

          # Сборка образов с использованием секретов для тегов
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mysql-db ./mysql_db
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/database-service ./database_service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/auth-app ./auth_service

          # Запуск MySQL
          docker run -d --name mysql_db --network lab_network ${{ secrets.DOCKERHUB_USERNAME }}/mysql-db
          
          # Запуск сервиса БД
          docker run -d --name database_service --network lab_network ${{ secrets.DOCKERHUB_USERNAME }}/database-service
          
          # Запуск основного приложения (Auth App)
          docker run -d --name auth_app --network lab_network -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/auth-app

      # 5. Проверка доступности и ожидание БД
      - name: Wait for MySQL and Test Endpoints
        run: |
          echo "Ожидание запуска MySQL..."
          # Цикл, который ждет, пока порт 3306 станет доступен внутри сети
          for i in {1..20}; do
            if docker exec auth_app nc -zv mysql_db 3306; then
              echo "MySQL готов!"
              break
            fi
            echo "MySQL еще не отвечает, ждем..."
            sleep 2
          done

          echo "Проверка главной страницы..."
          curl -f http://localhost:80/index.php || exit 1

      # 6. Функциональный тест: Проверка валидации пароля (JSON)
      - name: Functional Test (JSON Validation)
        run: |
          # Отправляем JSON запрос с коротким паролем
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"password": "too_short_pass"}' \
            http://localhost:80/index.php)
          
          echo "Ответ от сервера: $RESPONSE"
          
          # Проверяем, что сервер вернул ошибку валидации (сообщение о коротком пароле)
          if echo "$RESPONSE" | grep -q "короткий"; then
              echo "✅ Тест пройден: валидация JSON работает корректно."
          else
              echo "❌ Тест провален: сервер не вернул ошибку на короткий пароль."
              exit 1
          fi

      # 7. Отправка готовых образов в Docker Hub
      - name: Push Images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mysql-db
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/database-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/auth-app

      # 8. Очистка ресурсов
      - name: Shutdown and Cleanup
        if: always()
        run: |
          docker stop auth_app database_service mysql_db || true
          docker rm auth_app database_service mysql_db || true
          docker network rm lab_network || true